name: Feature request
description: Propose a capability or improvement for Cadence.
title: '[feat] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Cadence stays deliberately small and self-hostable. Explain the user problem first, then the shape of the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow is painful today, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have evaluated.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - UI only
        - Analysis engine
        - API / persistence
        - Provider integrations
        - Docs / developer experience
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Compatibility constraints
      options:
        - label: It must keep working in Zero-Key Local mode.
        - label: It must not require a hosted database.
        - label: It must stay accessible (keyboard + screen reader).
        - label: I am willing to open a pull request for this.
