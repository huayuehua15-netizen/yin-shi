name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify production CSS
        run: |
          css_file=$(ls dist/assets/*.css | head -n 1)
          test -s "$css_file"
          grep -q '\.flex' "$css_file"
